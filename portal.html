<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Portal | Pragati Academy</title>
<meta name="description" content="Student portal demo — attendance, assignments, mock test performance, fees and mentorship for Pragati Academy students.">
<meta name="theme-color" content="#0A0D12">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Libre+Franklin:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/charts.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF4D18'/%3E%3Cpath d='M10 23V9h7a4.5 4.5 0 0 1 0 9h-7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="app">

<div class="app-shell">

  <aside class="app-side">
    <div class="side-head">
      <div class="side-brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 18V6h6a4 4 0 0 1 0 8H7" stroke="#0A0D12" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="17.5" cy="17.5" r="1.6" fill="#FF4D18"/>
          </svg>
        </span>
        <span>
          <span class="brand-name" style="font-size:.92rem">Pragati</span>
          <span class="side-app">Student Portal</span>
        </span>
      </div>
    </div>

    <nav class="side-nav" aria-label="Student portal">
      <div class="side-group">
        <div class="side-lab">Learning</div>
        <button class="side-i on" data-view="dashboard"><i data-i="grid"></i>Dashboard</button>
        <button class="side-i" data-view="classes"><i data-i="book"></i>My Classes</button>
        <button class="side-i" data-view="assignments"><i data-i="file"></i>Assignments<span class="badge">3</span></button>
        <button class="side-i" data-view="mocks"><i data-i="test"></i>Mock Tests</button>
      </div>
      <div class="side-group">
        <div class="side-lab">Progress</div>
        <button class="side-i" data-view="attendance"><i data-i="calendar"></i>Attendance</button>
        <button class="side-i" data-view="performance"><i data-i="chart"></i>Performance</button>
        <button class="side-i" data-view="fees"><i data-i="wallet"></i>Fees</button>
      </div>
      <div class="side-group">
        <div class="side-lab">Support</div>
        <button class="side-i" data-view="mentor"><i data-i="user"></i>Mentor</button>
        <button class="side-i" data-view="messages"><i data-i="mail"></i>Messages<span class="badge">2</span></button>
      </div>
      <div class="side-group">
        <div class="side-lab">Connected</div>
        <a class="side-i" href="crm.html"><i data-i="grid"></i>Admissions CRM</a>
        <a class="side-i" href="whatsapp.html"><i data-i="chat"></i>WhatsApp Engine</a>
      </div>
    </nav>

    <div class="side-foot">
      <a class="side-back" href="index.html"><i data-i="arrowL"></i>Back to website</a>
      <div class="side-user">
        <span class="avatar" style="background:#FF4D18">AV</span>
        <span style="min-width:0">
          <span class="side-un">Aditya Verma</span>
          <span class="side-ur">NEET 2027 · Batch A</span>
        </span>
      </div>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-top">
      <button class="icon-btn app-burger" aria-label="Open menu"><i data-i="menu"></i></button>
      <div>
        <div class="app-title" id="viewTitle">Dashboard</div>
        <div class="app-sub" id="viewSub">NEET 2027 · Classroom Batch A</div>
      </div>
      <div class="app-search">
        <i data-i="search"></i>
        <input type="search" placeholder="Search chapters, tests, notes…" aria-label="Search">
      </div>
      <button class="icon-btn" aria-label="Notifications"><i data-i="bell"></i><span class="dot"></span></button>
    </header>

    <div class="app-body">
      <section class="view on" data-view-pane="dashboard" id="v-dashboard"></section>
      <section class="view" data-view-pane="classes" id="v-classes"></section>
      <section class="view" data-view-pane="assignments" id="v-assignments"></section>
      <section class="view" data-view-pane="mocks" id="v-mocks"></section>
      <section class="view" data-view-pane="attendance" id="v-attendance"></section>
      <section class="view" data-view-pane="performance" id="v-performance"></section>
      <section class="view" data-view-pane="fees" id="v-fees"></section>
      <section class="view" data-view-pane="mentor" id="v-mentor"></section>
      <section class="view" data-view-pane="messages" id="v-messages"></section>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/portal.js"></script>
</body>
</html>
