<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admissions CRM | Pragati Academy</title>
<meta name="description" content="Admissions CRM demo — leads, counselling, applications, enrolments, follow-ups and counsellor reporting for Pragati Academy.">
<meta name="theme-color" content="#0A0D12">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Libre+Franklin:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/charts.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23241CE0'/%3E%3Cpath d='M10 23V9h7a4.5 4.5 0 0 1 0 9h-7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="app">

<div class="app-shell">

  <!-- ══ SIDEBAR ══════════════════════════════════════════════════════ -->
  <aside class="app-side">
    <div class="side-head">
      <div class="side-brand">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 18V6h6a4 4 0 0 1 0 8H7" stroke="#0A0D12" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="17.5" cy="17.5" r="1.6" fill="#FF4D18"/>
          </svg>
        </span>
        <span>
          <span class="brand-name" style="font-size:.92rem">Pragati</span>
          <span class="side-app">Admissions CRM</span>
        </span>
      </div>
    </div>

    <nav class="side-nav" aria-label="CRM">
      <div class="side-group">
        <div class="side-lab">Pipeline</div>
        <button class="side-i on" data-view="dashboard"><i data-i="grid"></i>Dashboard</button>
        <button class="side-i" data-view="leads"><i data-i="users"></i>Leads<span class="badge">22</span></button>
        <button class="side-i" data-view="counselling"><i data-i="chat"></i>Counselling</button>
        <button class="side-i" data-view="applications"><i data-i="file"></i>Applications</button>
        <button class="side-i" data-view="enrolments"><i data-i="cap"></i>Enrolments</button>
        <button class="side-i" data-view="followups"><i data-i="clock"></i>Follow-ups<span class="badge">24</span></button>
      </div>
      <div class="side-group">
        <div class="side-lab">Team</div>
        <button class="side-i" data-view="counsellor"><i data-i="target"></i>My Desk</button>
        <button class="side-i" data-view="counsellors"><i data-i="award"></i>Counsellors</button>
        <button class="side-i" data-view="reports"><i data-i="chart"></i>Reports</button>
        <button class="side-i" data-view="settings"><i data-i="settings"></i>Settings</button>
      </div>
      <div class="side-group">
        <div class="side-lab">Connected</div>
        <a class="side-i" href="whatsapp.html"><i data-i="chat"></i>WhatsApp Engine</a>
        <a class="side-i" href="portal.html"><i data-i="cap"></i>Student Portal</a>
      </div>
    </nav>

    <div class="side-foot">
      <a class="side-back" href="index.html"><i data-i="arrowL"></i>Back to website</a>
      <div class="side-user">
        <span class="avatar" style="background:#241CE0">NS</span>
        <span style="min-width:0">
          <span class="side-un">Neha Singh</span>
          <span class="side-ur">Senior Counsellor</span>
        </span>
      </div>
    </div>
  </aside>

  <!-- ══ MAIN ═════════════════════════════════════════════════════════ -->
  <div class="app-main">
    <header class="app-top">
      <button class="icon-btn app-burger" aria-label="Open menu"><i data-i="menu"></i></button>
      <div>
        <div class="app-title" id="viewTitle">Dashboard</div>
        <div class="app-sub" id="viewSub">Admissions overview · last 30 days</div>
      </div>
      <div class="app-search">
        <i data-i="search"></i>
        <input type="search" id="globalSearch" placeholder="Search leads, phone, course…" aria-label="Search leads">
      </div>
      <button class="icon-btn" aria-label="Notifications"><i data-i="bell"></i><span class="dot"></span></button>
      <button class="icon-btn" id="addLead" aria-label="Add lead"><i data-i="plus"></i></button>
    </header>

    <div class="app-body">
      <section class="view on" data-view-pane="dashboard" id="v-dashboard"></section>
      <section class="view" data-view-pane="leads" id="v-leads"></section>
      <section class="view" data-view-pane="counselling" id="v-counselling"></section>
      <section class="view" data-view-pane="applications" id="v-applications"></section>
      <section class="view" data-view-pane="enrolments" id="v-enrolments"></section>
      <section class="view" data-view-pane="followups" id="v-followups"></section>
      <section class="view" data-view-pane="counsellor" id="v-counsellor"></section>
      <section class="view" data-view-pane="counsellors" id="v-counsellors"></section>
      <section class="view" data-view-pane="reports" id="v-reports"></section>
      <section class="view" data-view-pane="settings" id="v-settings"></section>
    </div>
  </div>
</div>

<!-- ══ LEAD DRAWER ════════════════════════════════════════════════════ -->
<div class="drawer-bg" id="drawerBg"></div>
<aside class="drawer" id="drawer" aria-label="Lead detail"></aside>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/crm.js"></script>
</body>
</html>
