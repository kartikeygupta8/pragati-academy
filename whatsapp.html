<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WhatsApp Automation | Pragati Academy</title>
<meta name="description" content="WhatsApp automation demo — instant enquiry replies, quick-reply buttons and a five-step follow-up sequence for Pragati Academy admissions.">
<meta name="theme-color" content="#0A0D12">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Libre+Franklin:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/charts.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230FB981'/%3E%3Cpath d='M10 23V9h7a4.5 4.5 0 0 1 0 9h-7' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>
<body class="app">

<div class="app-shell">

  <aside class="app-side">
    <div class="side-head">
      <div class="side-brand">
        <span class="brand-mark" style="background:#25D366">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M7 18V6h6a4 4 0 0 1 0 8H7" stroke="#06251A" stroke-width="2.4" stroke-linecap="round"/>
            <circle cx="17.5" cy="17.5" r="1.6" fill="#06251A"/>
          </svg>
        </span>
        <span>
          <span class="brand-name" style="font-size:.92rem">Pragati</span>
          <span class="side-app" style="color:#25D366">WhatsApp Engine</span>
        </span>
      </div>
    </div>

    <nav class="side-nav" aria-label="WhatsApp engine">
      <div class="side-group">
        <div class="side-lab">Messaging</div>
        <button class="side-i on" data-view="inbox"><i data-i="chat"></i>Live Inbox<span class="badge">3</span></button>
        <button class="side-i" data-view="flow"><i data-i="zap"></i>Follow-up Flow</button>
        <button class="side-i" data-view="templates"><i data-i="file"></i>Templates</button>
        <button class="side-i" data-view="analytics"><i data-i="chart"></i>Analytics</button>
      </div>
      <div class="side-group">
        <div class="side-lab">Connected</div>
        <a class="side-i" href="crm.html"><i data-i="grid"></i>Admissions CRM</a>
        <a class="side-i" href="portal.html"><i data-i="cap"></i>Student Portal</a>
      </div>
    </nav>

    <div class="side-foot">
      <a class="side-back" href="index.html"><i data-i="arrowL"></i>Back to website</a>
      <div class="side-user">
        <span class="avatar" style="background:#0FB981">PA</span>
        <span style="min-width:0">
          <span class="side-un">Pragati Academy</span>
          <span class="side-ur">Business API · verified</span>
        </span>
      </div>
    </div>
  </aside>

  <div class="app-main">
    <header class="app-top">
      <button class="icon-btn app-burger" aria-label="Open menu"><i data-i="menu"></i></button>
      <div>
        <div class="app-title" id="viewTitle">Live Inbox</div>
        <div class="app-sub" id="viewSub">Automated replies with working quick-reply buttons</div>
      </div>
      <div class="app-search">
        <i data-i="search"></i>
        <input type="search" placeholder="Search conversations…" aria-label="Search conversations">
      </div>
      <button class="icon-btn" id="replayBtn" aria-label="Replay conversation"><i data-i="refresh"></i></button>
    </header>

    <div class="app-body">
      <section class="view on" data-view-pane="inbox" id="v-inbox"></section>
      <section class="view" data-view-pane="flow" id="v-flow"></section>
      <section class="view" data-view-pane="templates" id="v-templates"></section>
      <section class="view" data-view-pane="analytics" id="v-analytics"></section>
    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/charts.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/whatsapp.js"></script>
</body>
</html>
